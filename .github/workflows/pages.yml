name: Refresh weather and deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
concurrency:
  group: veratecloud-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/configure-pages@v5
      - name: Restore successful source cache
        uses: actions/cache@v4
        with:
          path: |
            .github/weather-source/data/expanded
            .github/weather-source/data/normalized/map-descriptions.json
            .github/weather-source/public/media/climate
            .github/weather-source/public/downloads/climate-map-refresh.json
            .github/weather-source/public/downloads/climate-map-regional-samples.csv
          key: weather-expanded-v1-${{ github.run_id }}
          restore-keys: weather-expanded-v1-
      - name: Install climate image text validator
        run: sudo apt-get update -qq && sudo apt-get install -y tesseract-ocr
      - name: Install pinned build dependencies
        working-directory: .github/weather-source
        run: |
          python -m pip install -r requirements.txt
          npm ci
      - name: Refresh and validate before staging
        working-directory: .github/weather-source
        env:
          WEATHER_REFRESH: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: python scripts/publish_refresh.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@v4
